# Display subsystem configuration
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# I2C configuration - nRF52840 uses nrfx driver
CONFIG_I2C=y
CONFIG_SENSOR=y

# Display logging
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# General logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Threading support
CONFIG_MULTITHREADING=y
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_PREEMPT_PRIORITIES=16

CONFIG_BUILD_OUTPUT_UF2=y
