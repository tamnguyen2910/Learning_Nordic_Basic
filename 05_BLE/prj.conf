# ===== BLE Stack =====
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=n

# ===== Logging - only show our messages =====
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# ===== Device Name =====
CONFIG_BT_DEVICE_NAME="promicro nrf52840"

# ===== Disable userspace to avoid syscalls issues =====
CONFIG_USERSPACE=n

# ===== Generate UF2 file for drag-and-drop flashing =====
CONFIG_BUILD_OUTPUT_UF2=y

# ===== Display SSD1309 OLED =====
CONFIG_DISPLAY=y